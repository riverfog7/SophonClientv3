name: Swift

on:
  push:
  pull_request:

jobs:
  transfer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.3.3"
      - run: swift build
      - run: swift test --filter 'testStreamedPatchWithCachedInputs|testTransfer'
